<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Campus IT Help Desk{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ url_for('index_page') }}">
          <span class="brand-kicker">Campus IT</span>
          <span class="brand-name">Campus IT Help Desk</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="{{ url_for('submit_page') }}"
             {% if active == 'submit' %}aria-current="page"{% endif %}>Submit Ticket</a>
          <a href="{{ url_for('queue_page') }}"
             {% if active == 'queue' %}aria-current="page"{% endif %}>Ticket Queue</a>
        </nav>
      </div>
    </header>

    <main class="main">
      {% block content %}{% endblock %}
    </main>

    {% if show_ads %}{% include "_ads.html" %}{% endif %}

    <footer class="site-footer">
      <div class="footer-inner">
        Campus IT Help Desk. By Ryan Demarest and Andrew Kelleman
      </div>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
